.docker_build_template:
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: 1
    BUILDKIT_PROGRESS: plain
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - |
      # Преобразуем в lowercase для Docker
      CI_REGISTRY_IMAGE_LOWER=$(echo "$CI_REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
      
      IMAGE_TAG="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
      IMAGE_TAG_LATEST="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}:latest"
      IMAGE_TAG_BRANCH="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}:${CI_COMMIT_REF_SLUG}"

      docker build \
        --cache-from ${IMAGE_TAG_LATEST} \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --tag ${IMAGE_TAG} \
        --tag ${IMAGE_TAG_LATEST} \
        --tag ${IMAGE_TAG_BRANCH} \
        --file ${DOCKERFILE_PATH} \
        ${BUILD_CONTEXT}

      docker push ${IMAGE_TAG}
      docker push ${IMAGE_TAG_LATEST}
      docker push ${IMAGE_TAG_BRANCH}
  after_script:
    - docker logout $CI_REGISTRY

.docker_build_with_cache_template:
  extends: .docker_build_template
  script:
    - |
      # Преобразуем в lowercase для Docker
      CI_REGISTRY_IMAGE_LOWER=$(echo "$CI_REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
      
      IMAGE_TAG="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
      IMAGE_TAG_LATEST="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}:latest"
      IMAGE_TAG_BRANCH="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}:${CI_COMMIT_REF_SLUG}"

      CACHE_ARGS=""
      if [ -n "$BUILD_STAGES" ]; then
        for stage in $BUILD_STAGES; do
          STAGE_IMAGE="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}-${stage}:cache"
          CACHE_ARGS="${CACHE_ARGS} --cache-from ${STAGE_IMAGE}"
          docker pull ${STAGE_IMAGE} || true
        done
      fi

      docker pull ${IMAGE_TAG_LATEST} || true

      docker build \
        ${CACHE_ARGS} \
        --cache-from ${IMAGE_TAG_LATEST} \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --tag ${IMAGE_TAG} \
        --tag ${IMAGE_TAG_LATEST} \
        --tag ${IMAGE_TAG_BRANCH} \
        --file ${DOCKERFILE_PATH} \
        ${BUILD_CONTEXT}

      if [ -n "$BUILD_STAGES" ]; then
        for stage in $BUILD_STAGES; do
          STAGE_IMAGE="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}-${stage}:cache"
          docker build \
            --target ${stage} \
            --cache-from ${STAGE_IMAGE} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --tag ${STAGE_IMAGE} \
            --file ${DOCKERFILE_PATH} \
            ${BUILD_CONTEXT}
          docker push ${STAGE_IMAGE} || true
        done
      fi

      docker push ${IMAGE_TAG}
      docker push ${IMAGE_TAG_LATEST}
      docker push ${IMAGE_TAG_BRANCH}

.docker_scan_template:
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - |
      # Преобразуем в lowercase для Docker
      CI_REGISTRY_IMAGE_LOWER=$(echo "$CI_REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
      
      IMAGE_TAG="${CI_REGISTRY_IMAGE_LOWER}/${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"

      apk add --no-cache curl
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      trivy image --severity HIGH,CRITICAL --exit-code 0 ${IMAGE_TAG}
  allow_failure: true

.docker_cleanup_template:
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker system prune -af --volumes
  when: manual